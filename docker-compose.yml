services:
  mysql:
    image: mysql:8.0
    container_name: cabik_mysql_db
    #restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - cabik_network
    volumes:
      - mysql_volume:/var/lib/mysql
      - ./docker/mysql/entrypoint.sh:/docker-entrypoint-initdb.d/entrypoint.sh

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: cabik_phpmyadmin
    #restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    networks:
      - cabik_network
    depends_on:
      - mysql

  laravel:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cabik_laravel
    #restart: always
    expose:
      - "9000"
    env_file:
    - .env
    volumes:
      - ./:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    networks:
      - cabik_network
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27
    container_name: cabik_nginx
    #restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - cabik_network
    depends_on:
      - laravel

volumes:
  mysql_volume:
  laravel_vendor:

networks:
  cabik_network:
    driver: bridge
